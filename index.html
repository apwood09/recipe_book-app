<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0"> 
    <title>Recipie Book App</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="app-container">

        <nav>
             <!-- add recipe -->
            <button class="tab-btn active" onclick="showTab('add')">Add Recipe</button>
             <!-- saved recipes -->
            <button class="tab-btn" onclick="showTab('view')">Saved Recipes</button>
        </nav>
        
        <!-- add recipe: input info & category options -->
        <div id="add-tab" class="tab-content">
            <form id="recipe-form">
                <h2>Add Recipe</h2>
                <!-- category dropdown menu -->
                <label for="categories">Choose a Category:</label>
                <select id="categories" name="categories">
                    <option value="Beverages">Beverages</option>
                    <option value="Appetizer">Appetizers</option>
                    <option value="Snack">Snacks</option>
                    <option value="Soups">Soups</option>
                    <option value="Salad">Salads</option>
                    <option value="Main">Main Dish</option>
                    <option value="Side">Side Dish</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Bread">Breads</option>
                <input type="text" id="recipe-name" placeholder="Recipe Name" required>
                <textarea id="recipe-ingredients" placeholder="Ingredients" required></textarea>
                <textarea id="recipe-steps" placeholder="Steps" required></textarea>
                <button type="submit">Save Recipe</button>
            </form>
        </div>

        <!-- saved recipes: category buttons & recipe display -->
        <div id="view-tab" class="tab-content">
            <h2>Saved Recipes</h2>
            <!-- category buttons -->
            <div class="tab">
                <button class="tablinks active" onclick="openRecipe(event, 'Beverages')">Beverages</button>
                <button class="tablinks" onclick="openRecipe(event, 'Appetizers')">Appetizers</button>
                <button class="tablinks" onclick="openRecipe(event, 'Snacks')">Snacks</button>
                <button class="tablinks" onclick="openRecipe(event, 'Breads')">Breads</button>
                <button class="tablinks" onclick="openRecipe(event, 'Soups')">Soups</button>
                <button class="tablinks" onclick="openRecipe(event, 'Salads')">Salads</button>
                <button class="tablinks" onclick="openRecipe(event, 'Main Dish')">Main Dish</button>
                <button class="tablinks" onclick="openRecipe(event, 'Side Dish')">Side Dish</button>
                <button class="tablinks" onclick="openRecipe(event, 'Breakfast')">Breakfast</button>
            </div>
            <!-- recipe display -->
            <div id="display-area"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
